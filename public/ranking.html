<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash It - Ranking</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonte Supercell Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-text">SMASH IT!</span>
        </div>
        <nav class="nav-bar">
            <ul class="nav-links">
                <li><a class="link1" href="index.html">Início</a></li>
                <li><a class="link1 btn-ranking" href="ranking.html">Ranking</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <div class="card-game card-ranking">
            <h1 class="game-title">RANKING</h1>
            <p class="game-subtitle">TOP 10 MELHORES PONTUAÇÕES</p>

            <div class="table-container">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>JOGADOR</th>
                            <th>PONTOS</th>
                            <th>DATA</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body">
                        <tr>
                            <td colspan="4" class="loading">CARREGANDO...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="actions">
                <a href="index.html" class="btn-action btn-green">JOGAR</a>
                <button class="btn-action btn-yellow" onclick="carregarRanking()">ATUALIZAR</button>
            </div>
        </div>
    </main>

    <footer>
        <p>Todos os direitos reservados &copy; 2026 - Smash It Game</p>
    </footer>

    <script>
        async function carregarRanking() {
            const tbody = document.getElementById('ranking-body');
            tbody.innerHTML = '<tr><td colspan="4" class="loading">CARREGANDO...</td></tr>';

            try {
                const response = await fetch('/api/ranking');
                
                if (!response.ok) {
                    throw new Error('Falha ao buscar os dados.');
                }

                const ranking = await response.json();
                tbody.innerHTML = '';

                if (ranking.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">SJA O PRIMEIRO A JOGAR!</td></tr>';
                    return;
                }

                ranking.forEach((jogador, index) => {
                    const pos = index + 1;
                    const tr = document.createElement('tr');

                    if (pos === 1) tr.classList.add('rank-1');
                    else if (pos === 2) tr.classList.add('rank-2');
                    else if (pos === 3) tr.classList.add('rank-3');

                    const dataFormatada = new Date(jogador.data_registro).toLocaleDateString('pt-BR');

                    tr.innerHTML = `
                        <td><span class="badge pos-${pos}">${pos}º</span></td>
                        <td>${escapeHtml(jogador.nickname)}</td>
                        <td>${jogador.pontuacao}</td>
                        <td>${dataFormatada}</td>
                    `;

                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Erro ao carregar o ranking:', error);
                tbody.innerHTML = '<tr><td colspan="4" style="color: #ff3838;">ERRO AO CARREGAR O RANKING</td></tr>';
            }
        }

        function escapeHtml(texto) {
            const div = document.createElement('div');
            div.innerText = texto;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', carregarRanking);
    </script>
</body>
</html>
